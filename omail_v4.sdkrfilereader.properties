####################################################################################
# MAIL FlexConnector syslog sub-agent parser  -  v4.3.0  (submessage format)
# Log source : OMAIL stack (Postfix, Cyrus IMAP, Amavisd-new/SpamAssassin/ClamAV,
#              OpenDKIM, OpenDMARC, policyd-spf, postfwd2, saslauthd, UFW, sshd)
# Connector  : osdc-OMAIL-Syslogd_515  (UDP 515, VIP 192.168.210.70)
# Built from : 08-Sep-2026 16:47-17:22 IST (695,442 events) and
#              08-Sep 18:34 - 09-Sep 04:29 IST (4,781,723 events), 12 servers
# Author     : CSOC SIEM Engineering
#
# FORMAT: one base regex splits "process[pid]: message" (syslog header optional).
# The process FAMILY (postfix, cyrus, amavis, ...) selects a submessage block;
# inside a block, patterns are tried in order and the FIRST match wins.
# Each family ends with a catch-all pattern, so nothing leaves this parser unparsed.
# Processes outside the 12 families (systemd, CRON, ns-slapd, ...) get the base
# event only: deviceEventClassId=omail:other, message = full text.
#
# deviceVendor  = OMAIL (constant)
# deviceProduct = Postfix | Cyrus IMAP | Amavisd-new | OpenDKIM | OpenDMARC | UFW | ClamAV | Linux
# deviceProcessName = full process name (postfix/submission/smtpd, cyrus/sieve, ...)
#
# Custom field convention (fixed so ESM variables/reports can rely on them):
#   cs1 Queue ID       cs2 Message ID      cs3 Result          cs4 Detail / HELO / Relay / Mailbox
#   cs5 Session/Task   cs6 Auth Mechanism  cn1 Size Bytes      cn2 Count / Code
#   cn3 Elapsed ms     cfp1 Spam Score     cfp2 Required       cfp3 Delay Seconds
#
# Connector filter (agent.properties) drops deviceEventClassId IN (cyrus:debug, amavis:debug).
# Total patterns: 64
####################################################################################

do.unparsed.events=true
regex=^(?:<\\d+>)?(?:\\w{3}\\s+\\d+\\s+[\\d:]+\\s+\\S+\\s+)?((?:postfix|cyrus|amavis|opendmarc|opendkim|policyd\\-spf|postfwd2|saslauthd|kernel|sshd|clamd|freshclam)(?![\\w.-])|[\\w.-]+)((?:/[\\w./-]+)?)(?:\\[(\\d+)\\]?)?:?\\s(.*)$
token.count=4
token[0].name=family
token[0].type=String
token[1].name=rest
token[1].type=String
token[2].name=pid
token[2].type=Integer
token[3].name=msg
token[3].type=String

event.deviceVendor=__stringConstant("OMAIL")
event.deviceProduct=__stringConstant("OMAIL Platform")
event.deviceProcessName=__concatenate(family,rest)
event.deviceProcessId=pid
event.message=msg
event.deviceEventClassId=__stringConstant("omail:other")
event.name=__concatenate(family," message")
event.deviceSeverity=__stringConstant("info")
event.categoryDeviceGroup=__stringConstant("/Application")
event.categoryObject=__stringConstant("/Host/Application/Service")
event.categoryBehavior=__stringConstant("/Execute")
event.categoryOutcome=__stringConstant("/Attempt")
event.categorySignificance=__stringConstant("/Normal")

severity.map.veryhigh.if.deviceSeverity=high,critical
severity.map.high.if.deviceSeverity=medium
severity.map.medium.if.deviceSeverity=warning,notice
severity.map.low.if.deviceSeverity=info,low,debug

submessage.messageid.token=family
submessage.token=msg
submessage.count=12


#=================================================================== postfix
submessage[0].messageid=postfix
submessage[0].pattern.count=16

#---- [0][0] postfix: SASL auth failed
# CONFIRMED LIVE: distributed spray, ~100 IPs x 3-4 attempts/night. Rule: distinct sourceAddress per hour.
submessage[0].pattern[0].regex=^warning:\\s+(\\S+?)\\[([\\d.]+)\\]:\\s+SASL\\s+(\\S+)\\s+authentication failed:\\s*(.*)
submessage[0].pattern[0].fields=event.sourceHostName,event.sourceAddress,event.deviceCustomString6,event.message
submessage[0].pattern[0].extramappings=event.deviceProduct\=__stringConstant("Postfix")|event.deviceEventClassId\=__stringConstant("postfix:sasl:authfail")|event.name\=__stringConstant("SMTP Authentication Failed")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.deviceAction\=__stringConstant("failed")|event.deviceSeverity\=__stringConstant("warning")|event.categoryBehavior\=__stringConstant("/Authentication/Verify")|event.categoryOutcome\=__stringConstant("/Failure")|event.categorySignificance\=__stringConstant("/Suspicious")|event.deviceCustomString6Label\=__stringConstant("Auth Mechanism")

#---- [0][1] postfix: NOQUEUE reject
# RBL / rDNS / HELO / unknown recipient. sourceUserName ending @odisha.gov.in from external IP = spoof attempt (108/night).
submessage[0].pattern[1].regex=^NOQUEUE:\\s+(reject|discard|hold|warn)(?:_\\w+)?:\\s+(\\S+)\\s+from\\s+(\\S+?)\\[([\\d.]+)\\]:\\s+(\\d{3})\\s+(\\S+)\\s+(.*?);\\s+from=<([^>]*)>\\s+to=<([^>]*)>\\s+proto=(\\S+)\\s+helo=<([^>]*)>
submessage[0].pattern[1].fields=event.deviceAction,event.deviceCustomString5,event.sourceHostName,event.sourceAddress,event.deviceCustomNumber2,event.deviceCustomString3,event.message,event.sourceUserName,event.destinationUserName,event.applicationProtocol,event.deviceCustomString4
submessage[0].pattern[1].extramappings=event.deviceProduct\=__stringConstant("Postfix")|event.deviceEventClassId\=__stringConstant("postfix:noqueue:reject")|event.name\=__stringConstant("Inbound Mail Rejected")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.deviceSeverity\=__stringConstant("notice")|event.categoryBehavior\=__stringConstant("/Access")|event.categoryOutcome\=__stringConstant("/Failure")|event.categorySignificance\=__stringConstant("/Informational/Warning")|event.deviceCustomString3Label\=__stringConstant("Result Code")|event.deviceCustomString4Label\=__stringConstant("HELO")|event.deviceCustomString5Label\=__stringConstant("SMTP Stage")|event.deviceCustomNumber2Label\=__stringConstant("SMTP Code")

#---- [0][2] postfix: Submission auth
# Source is always Roundcube (.215). Real client IP not available (open gap).
submessage[0].pattern[2].regex=^(\\w+):\\s+client=(\\S+?)\\[([\\d.]+)\\],\\s+sasl_method=(\\S+),\\s+sasl_username=(\\S+)
submessage[0].pattern[2].fields=event.deviceCustomString1,event.sourceHostName,event.sourceAddress,event.deviceCustomString6,event.sourceUserName
submessage[0].pattern[2].extramappings=event.deviceProduct\=__stringConstant("Postfix")|event.deviceEventClassId\=__stringConstant("postfix:submission:auth")|event.name\=__stringConstant("Authenticated Mail Submission")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.deviceAction\=__stringConstant("accepted")|event.deviceSeverity\=__stringConstant("info")|event.categoryBehavior\=__stringConstant("/Authentication/Verify")|event.categoryOutcome\=__stringConstant("/Success")|event.categorySignificance\=__stringConstant("/Normal")|event.deviceCustomString1Label\=__stringConstant("Queue ID")|event.deviceCustomString6Label\=__stringConstant("Auth Mechanism")

#---- [0][3] postfix: Client accepted
# deviceProcessName=postfix/smtpd is true inbound; postfix/10025/smtpd is Amavis re-injection.
submessage[0].pattern[3].regex=^(\\w+):\\s+client=(\\S+?)\\[([\\d.]+)\\]\\s*$
submessage[0].pattern[3].fields=event.deviceCustomString1,event.sourceHostName,event.sourceAddress
submessage[0].pattern[3].extramappings=event.deviceProduct\=__stringConstant("Postfix")|event.deviceEventClassId\=__stringConstant("postfix:smtpd:accept")|event.name\=__stringConstant("Message Accepted From Client")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.deviceAction\=__stringConstant("accepted")|event.categoryBehavior\=__stringConstant("/Access/Start")|event.deviceSeverity\=__stringConstant("info")|event.categoryOutcome\=__stringConstant("/Success")|event.categorySignificance\=__stringConstant("/Normal")|event.deviceCustomString1Label\=__stringConstant("Queue ID")

#---- [0][4] postfix: Delivery sent
# deviceProcessName: postfix/smtp = outbound to internet, postfix/lmtp = to Cyrus, postfix/amavis/smtp = to filter.
submessage[0].pattern[4].regex=^(\\w+):\\s+to=<([^>]*)>,(?:\\s+orig_to=<([^>]*)>,)?\\s+relay=([^,]+),(?:\\s+conn_use=\\d+,)?\\s+delay=(\\S+?),\\s+delays=\\S+?,\\s+dsn=(\\S+?),\\s+status=(sent)\\s+\\((.*)\\)?\\s*$
submessage[0].pattern[4].fields=event.deviceCustomString1,event.destinationUserName,event.deviceCustomString5,event.deviceCustomString4,event.deviceCustomFloatingPoint3,event.deviceCustomString3,event.deviceAction,event.message
submessage[0].pattern[4].extramappings=event.deviceProduct\=__stringConstant("Postfix")|event.deviceEventClassId\=__stringConstant("postfix:delivery:sent")|event.name\=__stringConstant("Mail Delivery Sent")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.deviceSeverity\=__stringConstant("low")|event.categoryBehavior\=__stringConstant("/Communicate")|event.categoryOutcome\=__stringConstant("/Success")|event.categorySignificance\=__stringConstant("/Informational")|event.deviceCustomString1Label\=__stringConstant("Queue ID")|event.deviceCustomString3Label\=__stringConstant("Result Code")|event.deviceCustomString4Label\=__stringConstant("Relay")|event.deviceCustomString5Label\=__stringConstant("Original Recipient")|event.deviceCustomFloatingPoint3Label\=__stringConstant("Delay Seconds")

#---- [0][5] postfix: Delivery failed
# 604 deferred vs 284 sent overnight - Gmail inbox-full and MX timeouts.
submessage[0].pattern[5].regex=^(\\w+):\\s+to=<([^>]*)>,(?:\\s+orig_to=<([^>]*)>,)?\\s+relay=([^,]+),(?:\\s+conn_use=\\d+,)?\\s+delay=(\\S+?),\\s+delays=\\S+?,\\s+dsn=(\\S+?),\\s+status=(bounced|deferred|expired|undeliverable)\\s+\\((.*)\\)?\\s*$
submessage[0].pattern[5].fields=event.deviceCustomString1,event.destinationUserName,event.deviceCustomString5,event.deviceCustomString4,event.deviceCustomFloatingPoint3,event.deviceCustomString3,event.deviceAction,event.message
submessage[0].pattern[5].extramappings=event.deviceProduct\=__stringConstant("Postfix")|event.deviceEventClassId\=__stringConstant("postfix:delivery:failed")|event.name\=__stringConstant("Mail Delivery Failed")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.deviceSeverity\=__stringConstant("medium")|event.categoryBehavior\=__stringConstant("/Communicate")|event.categoryOutcome\=__stringConstant("/Failure")|event.categorySignificance\=__stringConstant("/Informational/Warning")|event.deviceCustomString1Label\=__stringConstant("Queue ID")|event.deviceCustomString3Label\=__stringConstant("Result Code")|event.deviceCustomString4Label\=__stringConstant("Relay")|event.deviceCustomString5Label\=__stringConstant("Original Recipient")|event.deviceCustomFloatingPoint3Label\=__stringConstant("Delay Seconds")

#---- [0][6] postfix: qmgr queued
# cn2 = recipient count = mass-mail / compromised account indicator.
submessage[0].pattern[6].regex=^(\\w+):\\s+from=<([^>]*)>,\\s+size=(\\d+),\\s+nrcpt=(\\d+)\\s*(?:\\((.*)\\))?
submessage[0].pattern[6].fields=event.deviceCustomString1,event.sourceUserName,event.deviceCustomNumber1,event.deviceCustomNumber2,event.message
submessage[0].pattern[6].extramappings=event.deviceProduct\=__stringConstant("Postfix")|event.deviceEventClassId\=__stringConstant("postfix:qmgr:active")|event.name\=__stringConstant("Message Queued For Delivery")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.categoryBehavior\=__stringConstant("/Communicate/Query")|event.deviceSeverity\=__stringConstant("info")|event.categoryOutcome\=__stringConstant("/Success")|event.categorySignificance\=__stringConstant("/Normal")|event.deviceCustomString1Label\=__stringConstant("Queue ID")|event.deviceCustomNumber1Label\=__stringConstant("Size Bytes")|event.deviceCustomNumber2Label\=__stringConstant("Recipient Count")

#---- [0][7] postfix: message-id
# Join key Queue ID (cs1) <-> Message ID (cs2). Message ID links Postfix, Amavis, Cyrus LMTP.
submessage[0].pattern[7].regex=^(\\w+):\\s+message-id=<?([^>]*)>?\\s*$
submessage[0].pattern[7].fields=event.deviceCustomString1,event.deviceCustomString2
submessage[0].pattern[7].extramappings=event.deviceProduct\=__stringConstant("Postfix")|event.deviceEventClassId\=__stringConstant("postfix:cleanup:msgid")|event.name\=__stringConstant("Message ID Assigned")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.categoryBehavior\=__stringConstant("/Create")|event.deviceSeverity\=__stringConstant("info")|event.categoryOutcome\=__stringConstant("/Success")|event.categorySignificance\=__stringConstant("/Normal")|event.deviceCustomString1Label\=__stringConstant("Queue ID")|event.deviceCustomString2Label\=__stringConstant("Message ID")

#---- [0][8] postfix: pickup
# Mail injected locally (sendmail binary / cron / web app). uid=114 from gmail seen live on postfix02.
submessage[0].pattern[8].regex=^(\\w+):\\s+uid=(\\d+)\\s+from=<([^>]*)>
submessage[0].pattern[8].fields=event.deviceCustomString1,event.sourceUserId,event.sourceUserName
submessage[0].pattern[8].extramappings=event.deviceProduct\=__stringConstant("Postfix")|event.deviceEventClassId\=__stringConstant("postfix:pickup")|event.name\=__stringConstant("Local Mail Submitted")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.categoryBehavior\=__stringConstant("/Create")|event.deviceSeverity\=__stringConstant("info")|event.categoryOutcome\=__stringConstant("/Success")|event.categorySignificance\=__stringConstant("/Normal")|event.deviceCustomString1Label\=__stringConstant("Queue ID")

#---- [0][9] postfix: rDNS fail
submessage[0].pattern[9].regex=^warning:\\s+hostname\\s+(\\S+)\\s+does not resolve to address\\s+([\\d.]+)(?::\\s+(.*))?
submessage[0].pattern[9].fields=event.sourceHostName,event.sourceAddress,event.message
submessage[0].pattern[9].extramappings=event.deviceProduct\=__stringConstant("Postfix")|event.deviceEventClassId\=__stringConstant("postfix:rdns:mismatch")|event.name\=__stringConstant("Reverse DNS Verification Failed")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.deviceSeverity\=__stringConstant("low")|event.categoryBehavior\=__stringConstant("/Authentication/Verify")|event.categoryOutcome\=__stringConstant("/Failure")|event.categorySignificance\=__stringConstant("/Informational/Warning")

#---- [0][10] postfix: lost connection
# cs5=AUTH with many IPs = credential spray (357/night). cs5=CONNECT = scanner.
submessage[0].pattern[10].regex=^(lost connection|timeout|too many errors)\\s+after\\s+(\\S+)(?:\\s+\\(\\d+ bytes\\))?\\s+from\\s+(\\S+?)\\[([\\d.]+)\\]
submessage[0].pattern[10].fields=event.message,event.deviceCustomString5,event.sourceHostName,event.sourceAddress
submessage[0].pattern[10].extramappings=event.deviceProduct\=__stringConstant("Postfix")|event.deviceEventClassId\=__stringConstant("postfix:smtpd:lost")|event.name\=__stringConstant("SMTP Connection Lost")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.deviceSeverity\=__stringConstant("low")|event.categoryBehavior\=__stringConstant("/Access/Stop")|event.categoryOutcome\=__stringConstant("/Failure")|event.categorySignificance\=__stringConstant("/Informational/Warning")|event.deviceCustomString5Label\=__stringConstant("SMTP Stage")

#---- [0][11] postfix: TLS established
# cs3 = Untrusted | Anonymous | Trusted | Verified. Alert on TLSv1.0/1.1 in cs4 if policy requires.
submessage[0].pattern[11].regex=^(\\w+)\\s+TLS connection established (?:from|to)\\s+(\\S+?)\\[([\\d.]+)\\](?::\\d+)?:\\s+(\\S+\\s+with cipher\\s+\\S+)\\s+\\((\\d+)/\\d+\\s+bits\\)
submessage[0].pattern[11].fields=event.deviceCustomString3,event.sourceHostName,event.sourceAddress,event.deviceCustomString4,event.deviceCustomNumber2
submessage[0].pattern[11].extramappings=event.deviceProduct\=__stringConstant("Postfix")|event.deviceEventClassId\=__stringConstant("postfix:tls")|event.name\=__stringConstant("TLS Connection Established")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.categoryBehavior\=__stringConstant("/Access/Start")|event.deviceSeverity\=__stringConstant("info")|event.categoryOutcome\=__stringConstant("/Success")|event.categorySignificance\=__stringConstant("/Normal")|event.deviceCustomString3Label\=__stringConstant("Result")|event.deviceCustomString4Label\=__stringConstant("Detail")|event.deviceCustomNumber2Label\=__stringConstant("Key Bits")

#---- [0][12] postfix: connect
submessage[0].pattern[12].regex=^connect from\\s+(\\S+?)\\[([\\d.]+)\\]
submessage[0].pattern[12].fields=event.sourceHostName,event.sourceAddress
submessage[0].pattern[12].extramappings=event.deviceProduct\=__stringConstant("Postfix")|event.deviceEventClassId\=__stringConstant("postfix:smtpd:connect")|event.name\=__stringConstant("SMTP Connection Opened")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.categoryBehavior\=__stringConstant("/Access/Start")|event.deviceSeverity\=__stringConstant("info")|event.categoryOutcome\=__stringConstant("/Success")|event.categorySignificance\=__stringConstant("/Normal")

#---- [0][13] postfix: disconnect
# message='ehlo=1 auth=0/1 mail=0 ...' - auth=0/N with mail=0 = failed auth probe session.
submessage[0].pattern[13].regex=^disconnect from\\s+(\\S+?)\\[([\\d.]+)\\]\\s*(.*)
submessage[0].pattern[13].fields=event.sourceHostName,event.sourceAddress,event.message
submessage[0].pattern[13].extramappings=event.deviceProduct\=__stringConstant("Postfix")|event.deviceEventClassId\=__stringConstant("postfix:smtpd:disconnect")|event.name\=__stringConstant("SMTP Connection Closed")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.categoryBehavior\=__stringConstant("/Access/Stop")|event.deviceSeverity\=__stringConstant("info")|event.categoryOutcome\=__stringConstant("/Success")|event.categorySignificance\=__stringConstant("/Normal")

#---- [0][14] postfix: warning
# LIVE: 204k/night on postfix01 = LDAP bind to ldap://localhost:389 failing + root@ mail queued 132 days. Also uceprotect RBL lookups failing. Ops issues for mail team.
submessage[0].pattern[14].regex=^warning:\\s+(.*)
submessage[0].pattern[14].fields=event.message
submessage[0].pattern[14].extramappings=event.deviceProduct\=__stringConstant("Postfix")|event.deviceEventClassId\=__stringConstant("postfix:warning")|event.name\=__stringConstant("Postfix Warning")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.categoryBehavior\=__stringConstant("/Execute")|event.deviceSeverity\=__stringConstant("warning")|event.categoryOutcome\=__stringConstant("/Failure")|event.categorySignificance\=__stringConstant("/Informational/Warning")

#---- [0][15] postfix: other
# qmgr removed, local passing, anvil stats, scache, bounce, postsuper, trivial-rewrite warnings.
submessage[0].pattern[15].regex=^(.*)
submessage[0].pattern[15].fields=event.message
submessage[0].pattern[15].extramappings=event.deviceProduct\=__stringConstant("Postfix")|event.deviceEventClassId\=__stringConstant("postfix:other")|event.name\=__stringConstant("Postfix Message")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.categoryBehavior\=__stringConstant("/Execute")|event.deviceSeverity\=__stringConstant("info")|event.categoryOutcome\=__stringConstant("/Success")|event.categorySignificance\=__stringConstant("/Normal")

#=================================================================== cyrus
submessage[1].messageid=cyrus
submessage[1].pattern.count=9

#---- [1][0] cyrus: badlogin
# user usually '-notset-'; real username is in saslauthd event. Source is Roundcube, not end user.
submessage[1].pattern[0].regex=^badlogin:\\s+(\\S+)\\s+\\[([^\\]]+)\\]\\s+(\\S+)\\s+\\(([^)]*)\\)\\s*\\[?(.*?)\\]?\\s*$
submessage[1].pattern[0].fields=event.sourceHostName,event.sourceAddress,event.deviceCustomString6,event.destinationUserName,event.message
submessage[1].pattern[0].extramappings=event.deviceProduct\=__stringConstant("Cyrus IMAP")|event.deviceEventClassId\=__stringConstant("cyrus:badlogin")|event.name\=__stringConstant("Mailbox Login Failed")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.deviceAction\=__stringConstant("failed")|event.deviceSeverity\=__stringConstant("warning")|event.categoryBehavior\=__stringConstant("/Authentication/Verify")|event.categoryOutcome\=__stringConstant("/Failure")|event.categorySignificance\=__stringConstant("/Suspicious")|event.deviceCustomString6Label\=__stringConstant("Auth Mechanism")

#---- [1][1] cyrus: login
# 100% via roundcube02dc/.215 or roundcube04dc/.217 - any other source = direct IMAP client. deviceProcessName=cyrus/sieve = user opened filter/forwarding rules (only Sieve telemetry available).
submessage[1].pattern[1].regex=^login:\\s+(\\S+)\\s+\\[([^\\]]+)\\]\\s+(\\S+)\\s+(\\S+)\\s+User logged in(?:\\s+SESSIONID=<([^>]+)>)?
submessage[1].pattern[1].fields=event.sourceHostName,event.sourceAddress,event.destinationUserName,event.deviceCustomString6,event.deviceCustomString5
submessage[1].pattern[1].extramappings=event.deviceProduct\=__stringConstant("Cyrus IMAP")|event.deviceEventClassId\=__stringConstant("cyrus:login")|event.name\=__stringConstant("Mailbox User Logged In")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.deviceAction\=__stringConstant("login")|event.deviceSeverity\=__stringConstant("info")|event.categoryBehavior\=__stringConstant("/Authentication/Verify")|event.categoryOutcome\=__stringConstant("/Success")|event.categorySignificance\=__stringConstant("/Normal")|event.deviceCustomString5Label\=__stringConstant("Session ID")|event.deviceCustomString6Label\=__stringConstant("Auth Mechanism")

#---- [1][2] cyrus: client id
# Anything other than Roundcube/Kolab = new client type on the platform.
submessage[1].pattern[2].regex=^client id sessionid=<([^>]+)>:\\s+"name"\\s+"([^"]*)"\\s+"version"\\s+"([^"]*)"
submessage[1].pattern[2].fields=event.deviceCustomString5,event.requestClientApplication,event.deviceCustomString4
submessage[1].pattern[2].extramappings=event.deviceProduct\=__stringConstant("Cyrus IMAP")|event.deviceEventClassId\=__stringConstant("cyrus:clientid")|event.name\=__stringConstant("IMAP Client Identified")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.categoryBehavior\=__stringConstant("/Access")|event.deviceSeverity\=__stringConstant("info")|event.categoryOutcome\=__stringConstant("/Success")|event.categorySignificance\=__stringConstant("/Normal")|event.deviceCustomString4Label\=__stringConstant("Client Version")|event.deviceCustomString5Label\=__stringConstant("Session ID")

#---- [1][3] cyrus: starttls
# 88k/night, pure noise - add to connector filter if licence EPS matters.
submessage[1].pattern[3].regex=^starttls:\\s+(\\S+\\s+with cipher\\s+\\S+)\\s+\\((\\d+)/\\d+\\s+bits[^)]*\\)\\s*(.*)
submessage[1].pattern[3].fields=event.deviceCustomString4,event.deviceCustomNumber2,event.message
submessage[1].pattern[3].extramappings=event.deviceProduct\=__stringConstant("Cyrus IMAP")|event.deviceEventClassId\=__stringConstant("cyrus:starttls")|event.name\=__stringConstant("Mailbox TLS Session Established")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.categoryBehavior\=__stringConstant("/Access/Start")|event.deviceSeverity\=__stringConstant("info")|event.categoryOutcome\=__stringConstant("/Success")|event.categorySignificance\=__stringConstant("/Normal")|event.deviceCustomString4Label\=__stringConstant("Detail")|event.deviceCustomNumber2Label\=__stringConstant("Key Bits")

#---- [1][4] cyrus: delivered
# Mailbox odisha.gov.in!user.dfo^puriwl ('^' = '.'). Final proof of delivery; joins on cs2.
submessage[1].pattern[4].regex=^Delivered:\\s+<([^>]*)>\\s+to mailbox:\\s+(\\S+)
submessage[1].pattern[4].fields=event.deviceCustomString2,event.deviceCustomString4
submessage[1].pattern[4].extramappings=event.deviceProduct\=__stringConstant("Cyrus IMAP")|event.deviceEventClassId\=__stringConstant("cyrus:lmtp:delivered")|event.name\=__stringConstant("Message Delivered To Mailbox")|event.categoryDeviceGroup\=__stringConstant("/Application")|event.categoryObject\=__stringConstant("/Host/Application/Service")|event.deviceAction\=__stringConstant("delivered")|event.categoryBehavior\=__stringConstant("/Communicate")|event.deviceSeverity\=__stringConstant("info")|event.categoryOutcome\=__stringConstant("/Success")|event.categorySignificance\=__stringConstant("/Normal")|event.deviceCustomString2Label\=__stringConstant("Message ID")|event.deviceCustomString4Label\=__stringConstant("Mailbox")

#---- [1][5] cyrus: expunged
# Large cn2 on Sent/INBOX = evidence wiping after compromise.
submessage[1].pattern[5].regex=^Expunged\\s+(\\d+)\\s+messages from\\s+(\\S+)
